<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOVEGEN — Filters (Man)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/categories.css" />
  <link rel="stylesheet" href="../css/filters.css" />
</head>
<body>
  <div class="app app--plain">
    <!-- Header -->
    <header class="app-header">
      <div class="brand" aria-label="LOVEGEN logo">
        <span class="lg-ovegen">LOVEGEN</span>
      </div>
      <button class="icon chevron" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </header>

    <!-- Filter Panel -->
    <section class="panel">
      <nav class="cat-tabs" aria-label="Category tabs">
        <a href="filters-woman.html">WOMAN</a>
        <a href="#" class="active">MAN</a>
        <a href="filters.html">ACCESSORIES</a>
        <a href="../index.html">HOME</a>
      </nav>

      <div class="filters" role="form" aria-label="Filters">
        <!-- Category -->
        <div class="filter-section">
          <div class="filter-title">CATEGORY</div>
          <label class="checkbox">
            <input type="checkbox" aria-label="Top" />
            <span>TOP</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" aria-label="Bottom" />
            <span>BOTTOM</span>
          </label>
        </div>

        <!-- Color -->
        <div class="filter-section">
          <div class="filter-title">COLOR</div>
          <div class="swatches" role="group" aria-label="Color swatches">
            <button class="swatch swatch-green" aria-label="Green"></button>
            <button class="swatch swatch-indigo" aria-label="Indigo"></button>
            <button class="swatch swatch-navy" aria-label="Navy"></button>
            <button class="swatch swatch-orange" aria-label="Orange"></button>
            <button class="swatch swatch-sky" aria-label="Sky"></button>
            <button class="swatch swatch-red" aria-label="Red"></button>
            <button class="swatch swatch-teal" aria-label="Teal"></button>
            <button class="swatch swatch-black" aria-label="Black"></button>
          </div>
        </div>

        <!-- Collections for MAN -->
        <div class="filter-section">
          <div class="filter-title">MAN</div>
          <ul class="cat-list">
            <li>VIEW ALL</li>
            <li>NEW IN</li>
            <li>JEANS</li>
            <li>JOGGERS</li>
            <li>SHORTS</li>
            <li>TSHIRTS</li>
            <li>HOODIES</li>
            <li>JACKETS</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Bottom tab bar (same structure) -->
    <nav class="tabbar" aria-label="Primary">
      <a href="../pages/filters.html" class="tab-link">
      <button class="tab" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      </a>
      <a href="../pages/search.html" class="tab-link">
      <button class="tab" aria-label="Search">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      </a>
      <a href="../index.html" class="tab-link">
      <button class="tab logo-tab" aria-label="LOVEGEN">
        <span class="ring" aria-hidden="true"></span>
        <img class="fab-icon" alt="LOVEGEN icon" width="28" height="28"
             src="https://cdn.shopify.com/s/files/1/0837/4475/1921/files/fav-icon_e8d10352-e04d-466d-b6bf-a229702da831.png?v=1748765882" />
      </button>
      </a>
     <a href="../pages/cart.html" class="tab-link">
     <button class="tab" aria-label="Cart">
       <img width="24" height="24" src="https://img.icons8.com/ios-filled/24/shopping-bag--v1.png" alt="shopping-bag--v1" class="invert" />
     </button>
     </a>
      <a href="../pages/account.html" class="tab-link">
      <button class="tab" aria-label="Profile">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      </a>
    </nav>

  </div>
</body>
</html>
