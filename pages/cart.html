<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cart - LOVEGEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <button class="icon back" onclick="goBack()" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <div class="header-title">Cart</div>
    </header>

    <!-- Cart Content -->
    <main class="cart-content">
      <!-- Empty Cart State -->
      <div class="empty-cart">
        <div class="empty-cart-icon">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </div>
        <h2>Uh-oh! Your cart is empty</h2>
        <p>Looks like you haven't added anything to your cart yet</p>
        <a href="../index.html" class="start-shopping-btn">Start Shopping</a>
      </div>
    </main>

    <!-- Bottom tab bar -->
    <nav class="tabbar" aria-label="Primary">
      <a href="../pages/filters.html" class="tab-link">
      <button class="tab" aria-label="Menu">
        <!-- grid -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      </a>
      <a href="../pages/search.html" class="tab-link">
      <button class="tab" aria-label="Search">
        <!-- search -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      </a>
      <button class="tab logo-tab" aria-label="LOVEGEN">
        <span class="ring" aria-hidden="true"></span>
        <img class="fab-icon" alt="LOVEGEN icon" width="28" height="28"
             src="https://cdn.shopify.com/s/files/1/0837/4475/1921/files/fav-icon_e8d10352-e04d-466d-b6bf-a229702da831.png?v=1748765882" />
      </button>
      <button class="tab active" aria-label="Cart">
        <!-- bag -->
        <img width="24" height="24" src="https://img.icons8.com/ios-filled/24/shopping-bag--v1.png" alt="shopping-bag--v1" class="invert" />
      </button>
      <button class="tab" aria-label="Profile">
        <!-- user -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </nav>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
