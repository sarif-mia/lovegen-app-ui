<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ed">
  <meta name="description" content="LOVEGEN — expressive everyday fashion for every version of you.">
  <title>LOVEGEN — Wear your energy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="phone" id="app">
    <header class="topbar">
      <button class="round-btn" data-nav="shop" aria-label="Open shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="wordmark" data-nav="home" aria-label="LOVEGEN home">LOVE<span>GEN</span></button>
      <div class="top-actions">
        <button class="round-btn" data-nav="wishlist" aria-label="Wishlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><b class="count hidden" id="wishCount">0</b></button>
        <button class="round-btn" data-nav="cart" aria-label="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><b class="count hidden" id="cartCount">0</b></button>
      </div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-nav="home"><i><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3V11Z"/></svg></i><span>Home</span></button>
      <button class="nav-item" data-nav="shop"><i><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></i><span>Shop</span></button>
      <button class="nav-item nav-search" data-nav="search"><i><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></i><span>Search</span></button>
      <button class="nav-item" data-nav="cart"><i><svg viewBox="0 0 24 24"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg></i><span>Bag</span><b class="nav-dot hidden" id="navCartCount">0</b></button>
      <button class="nav-item" data-nav="account"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></i><span>Profile</span></button>
    </nav>
  </main>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="product-sheet" id="productSheet" aria-label="Product details" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
